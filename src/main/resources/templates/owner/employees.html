<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Pharmacy | All Employees</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>List of Employees</h1>
        <div th:each="employee : ${employees}">
            <p><strong>Full Name:</strong> <span th:text="${employee.first_name + ' ' + employee.last_name}"></span></p>
            <p><strong>Address:</strong> <span th:text="${employee.address}"></span></p>
            <p><strong>Date of Joining:</strong> <span th:text="${employee.date_of_joining}"></span></p>
            <p><strong>Role:</strong> <span th:text="${employee.emp_role}"></span></p>
            <p><strong>Salary:</strong> <span th:text="${employee.salary}"></span></p>
            <div>
                <a th:href="@{/owner/employee/update(username=${employee.username})}">Update</a>
            </div>
        </div>
        <div><a href="/owner/addemployee">Add Employee</a></div>
        <button onclick="back()">Back</button>
    </body>
    <script th:inline="javascript">

        function back() {
            window.location.assign("/");
        }

    </script>
</html>
