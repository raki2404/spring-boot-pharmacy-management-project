<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Update Employee</title>
    </head>
    <body>
        <h1>Update Employee</h1>
        <form th:action="@{/owner/employee/update}" method="post" th:object="${employee}">
            <input type="hidden" th:field="*{id}" />

            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" th:field="*{first_name}" required/><br/>
            
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" th:field="*{last_name}" required/><br/>

            <label for="address">Address:</label>
            <input type="text" id="address" th:field="*{address}" required/><br/>

            <input type="hidden" id="dateOfJoining" th:field="*{date_of_joining}" required/><br/>

            <label for="empRole">Role:</label>
            <input type="text" id="empRole" th:field="*{emp_role}" required/><br/>

            <label for="salary">Salary:</label>
            <input type="number" id="salary" th:field="*{salary}" required/><br/>
            
            <input type="submit" value="Update Employee">
        </form>
        <button onclick="back()">Back</button>
    </body>
    <script th:inline="javascript">

        function back() {
            window.location.assign("/owner/employees");
        }

    </script>
</html>
