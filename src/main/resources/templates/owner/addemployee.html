<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Pharmacy | AddEmployee</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h2>Employee Details</h2>
        <form action='#' th:action='@{/owner/addemployee}' method="post" th:object='${employee}'>
            <label for="username">Username:</label><br>
            <input type="text" th:field="*{username}"><br><br>
            <label for="password">Password:</label><br>
            <input type="password" th:field="*{password}"><br><br>
            <label for="first_name">Firstname:</label><br>
            <input type="text" th:field="*{first_name}"><br><br>
            <label for="last_name">LastName:</label><br>
            <input type="text" th:field="*{last_name}"><br><br>
            <label for="address">Address:</label><br>
            <input type="text" th:field="*{address}"><br><br>
            <label for="date_of_joining">Date of Joining:</label><br>
            <input type="date" th:field="*{date_of_joining}"><br><br>
            <label for="emp_role">Role:</label><br>
            <input type="text" th:field="*{emp_role}"><br><br>
            <label for="salary">Salary:</label><br>
            <input type="number" th:field="*{salary}"><br><br>
            <input type="submit" value="AddEmployee">
        </form>
        <button onclick="back()">Back</button>
    </body>
    <script th:inline="javascript">

        function back() {
            window.location.assign("/");
        }

    </script>
</html>
